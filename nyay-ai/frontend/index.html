<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyay-AI: Digital AI Legal Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome for mic icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <div class="logo">⚖️ Nyay-AI</div>
            <div class="subtitle">Indian Law Digital Assistant</div>
            <div class="language-selector">
                <label for="lang-select">Voice Language:</label>
                <select id="lang-select">
                    <option value="en-IN">English (India)</option>
                    <option value="hi-IN">Hindi (India)</option>
                    <option value="bn-IN">Bengali (India)</option>
                    <option value="ta-IN">Tamil (India)</option>
                </select>
            </div>
        </header>

        <main class="chat-box" id="chat-box">
            <div class="message ai-message">
                Hello! I am Nyay-AI, your Indian Legal Assistant. How can I help you today? (Please note I only answer based on my provided legal database to ensure accuracy).
            </div>
        </main>

        <div class="input-area">
            <button id="mic-btn" class="mic-btn"><i class="fas fa-microphone"></i></button>
            <textarea id="user-input" placeholder="Type or speak your legal question..." rows="1"></textarea>
            <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
